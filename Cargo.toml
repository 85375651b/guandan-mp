[package]
name = "guandan-desktop"
version = "2.0.0"
edition = "2021"
description = "Native Guandan for Linux, with local bots and Tailscale multiplayer"
license = "ISC"
default-run = "guandan"

[features]
default = ["desktop"]
desktop = ["dep:eframe"]
screenshot = ["desktop", "eframe/__screenshot"]

[dependencies]
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "guandan"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "guandan-server"
path = "src/bin/server.rs"

[profile.release]
lto = "thin"
strip = true

